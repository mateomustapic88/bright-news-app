  <image x="64" y="52" width="82" height="82" href="brightnews-app-icon-512.png" xlink:href="brightnews-app-icon-512.png" />
  <text x="166" y="109" fill="#16191d" font-size="40" font-weight="800">BrightNews</text>

  <text x="64" y="234" fill="#16191d" font-size="52" font-weight="800">Positive news.</text>
  <text x="64" y="296" fill="#16191d" font-size="52" font-weight="800">A brighter perspective.</text>
  <rect x="64" y="332" width="82" height="7" fill="#f6b900" />
