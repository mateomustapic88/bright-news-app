name: News Publishing Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-health.yml'
      - 'scripts/check-news-health.mjs'
      - 'scripts/lib/news-health.mjs'
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: news-publishing-watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check live publishing independently of refresh runs
        id: health
        timeout-minutes: 5
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-news-health.mjs
      - name: Open or resolve the publishing incident
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const title = 'BrightNews publishing freshness alert';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100
            });
            const issue = issues.find(item => item.title === title && !item.pull_request);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.HEALTH_OUTCOME !== 'success') {
              const body = `The independent publishing check failed or could not run. Inspect the [workflow logs and country report](${url}).\n\nCheck publication timestamps, approved backlog, Groq quota, and scheduled refresh runs. Do not bypass moderation to restore freshness.`;
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body });
              core.setFailed('Publishing health needs attention.');
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Publishing freshness recovered. [Successful check](${url}).` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
