name: Post Stories to X

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-stories-to-x
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post selected BrightNews story to X
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_ACCOUNT_HANDLE: ${{ vars.X_ACCOUNT_HANDLE || 'brightnewsglob' }}
          BRIGHTNEWS_PUBLIC_URL: ${{ vars.BRIGHTNEWS_PUBLIC_URL || 'https://brightnews-three.vercel.app/' }}
          X_POST_MAX_STORIES: ${{ vars.X_POST_MAX_STORIES || '1' }}
          X_POST_LOOKBACK_HOURS: ${{ vars.X_POST_LOOKBACK_HOURS || '72' }}
          X_POST_MIN_SAVED_COUNT: ${{ vars.X_POST_MIN_SAVED_COUNT || '0' }}
        run: node scripts/post-stories-to-x.mjs
