name: Refresh News

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-news.yml'
      - 'scripts/refresh-news.mjs'
      - 'scripts/review-pending-with-groq.mjs'
      - 'scripts/publish-approved-stories.mjs'
      - 'scripts/lib/review-runtime.mjs'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-news
  # A deployed pipeline fix supersedes obsolete code; scheduled runs do not interrupt each other.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test ingestion and publishing safeguards
        run: node --test tests/ingestion-runtime.test.mjs tests/publishing-queue.test.mjs tests/news-health.test.mjs tests/review-batch.test.mjs

      - name: Validate required refresh environment variables
        id: ready
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing repository secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing repository secret: SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$GROQ_API_KEY" || (echo "Missing repository secret: GROQ_API_KEY" && exit 1)

      - name: Publish previously approved stories
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/publish-approved-stories.mjs

      - name: Ingest fresh articles
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 45
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_REVIEW_MODEL: ${{ vars.GROQ_REVIEW_MODEL || 'qwen/qwen3.8-27b' }}
          AI_REVIEW_LIMIT: ${{ vars.AI_REVIEW_LIMIT }}
          AI_REVIEW_PER_REGION_LIMIT: ${{ vars.AI_REVIEW_PER_REGION_LIMIT }}
          AI_REVIEW_DELAY_MS: ${{ vars.AI_REVIEW_DELAY_MS }}
          AI_REVIEW_MAX_RETRIES: ${{ vars.AI_REVIEW_MAX_RETRIES }}
          AI_REVIEW_MIN_CONFIDENCE: ${{ vars.AI_REVIEW_MIN_CONFIDENCE }}
          AI_REVIEW_MAX_DESCRIPTION_CHARS: ${{ vars.AI_REVIEW_MAX_DESCRIPTION_CHARS }}
          AI_REVIEW_MAX_CONTENT_CHARS: ${{ vars.AI_REVIEW_MAX_CONTENT_CHARS }}
          PUBLISH_APPROVED_LIMIT: ${{ vars.PUBLISH_APPROVED_LIMIT || '200' }}
          HEURISTIC_AUTO_APPROVE_SCORE: ${{ vars.HEURISTIC_AUTO_APPROVE_SCORE }}
          INGEST_GNEWS_REGION_CODES: ${{ vars.INGEST_GNEWS_REGION_CODES || 'world,us,uk,hr,ca,in' }}
          INGEST_GNEWS_MAX_RESULTS: ${{ vars.INGEST_GNEWS_MAX_RESULTS }}
          INGEST_GNEWS_PAGES: ${{ vars.INGEST_GNEWS_PAGES }}
          INGEST_GUARDIAN_REGION_CODES: ${{ vars.INGEST_GUARDIAN_REGION_CODES || 'world,uk,us,au' }}
          INGEST_GUARDIAN_PAGES: ${{ vars.INGEST_GUARDIAN_PAGES || '1' }}
          INGEST_GUARDIAN_PAGE_SIZE: ${{ vars.INGEST_GUARDIAN_PAGE_SIZE || '5' }}
          INGEST_GOOGLE_NEWS_RSS_MAX_ITEMS: ${{ vars.INGEST_GOOGLE_NEWS_RSS_MAX_ITEMS }}
          INGEST_GOOGLE_NEWS_RSS_MAX_RETRIES: ${{ vars.INGEST_GOOGLE_NEWS_RSS_MAX_RETRIES }}
          INGEST_NEWSDATA_REGION_CODES: ${{ vars.INGEST_NEWSDATA_REGION_CODES || 'world,us,uk,hr,ca,in' }}
          INGEST_NEWSDATA_PAGES: ${{ vars.INGEST_NEWSDATA_PAGES }}
          INGEST_NEWSDATA_TIMEFRAME: ${{ vars.INGEST_NEWSDATA_TIMEFRAME }}
          INGEST_GDELT_MAX_RECORDS: ${{ vars.INGEST_GDELT_MAX_RECORDS }}
          INGEST_RSS_MAX_ITEMS_PER_FEED: ${{ vars.INGEST_RSS_MAX_ITEMS_PER_FEED }}
          INGEST_RSS_MAX_RETRIES: ${{ vars.INGEST_RSS_MAX_RETRIES }}
        run: node scripts/refresh-news.mjs --ingest-only

      - name: Review a bounded batch with Groq
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_REVIEW_MODEL: ${{ vars.GROQ_REVIEW_MODEL || 'qwen/qwen3.8-27b' }}
          AI_REVIEW_LIMIT: '40'
          AI_REVIEW_PER_REGION_LIMIT: '4'
          AI_REVIEW_MAX_RETRIES: '2'
          AI_REVIEW_MIN_CONFIDENCE: ${{ vars.AI_REVIEW_MIN_CONFIDENCE }}
        run: node scripts/review-pending-with-groq.mjs

      - name: Publish approvals even if ingestion or review failed
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/publish-approved-stories.mjs

      - name: Check publication health for every country
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/check-news-health.mjs
