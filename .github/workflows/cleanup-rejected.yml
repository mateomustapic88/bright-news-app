name: Clean Up Old Rejected Articles

on:
  schedule:
    - cron: '32 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-rejected-articles
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/cleanup-rejected.test.mjs
      - name: Remove unlinked rejected records older than 14 days
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-rejected-articles.mjs
